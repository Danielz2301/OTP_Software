name: Performance Benchmarks (BenchmarkDotNet)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/OTPSoftware.Core/**'
      - 'tests/OTPSoftware.Benchmarks/**'

jobs:
  benchmarks:
    name: .NET 10 Micro-Benchmarks & Zero-Alloc Gate
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          include-prerelease: true

      - name: Restore Benchmarks
        run: dotnet restore tests/OTPSoftware.Benchmarks/OTPSoftware.Benchmarks.csproj

      - name: Run Short Micro-Benchmarks (Release)
        run: |
          dotnet run -c Release --project tests/OTPSoftware.Benchmarks/OTPSoftware.Benchmarks.csproj -- --filter * --job short --exporters json --artifacts ./BenchmarkArtifacts

      - name: Verify Zero-Allocation Invariants
        shell: pwsh
        run: |
          $reports = Get-ChildItem -Path ./BenchmarkArtifacts/results -Filter "*-report-full-compressed.json" -ErrorAction SilentlyContinue
          if (-not $reports) {
            Write-Warning "No JSON reports produced; skipping allocation gate."
            exit 0
          }
          foreach ($report in $reports) {
            $json = Get-Content $report.FullName | ConvertFrom-Json
            foreach ($bench in $json.Benchmarks) {
              $allocated = $bench.Memory.BytesAllocatedPerOperation
              if (($bench.MethodTitle -like "*ZeroAlloc*" -or $bench.MethodTitle -like "*HotRead*") -and $allocated -gt 0) {
                Write-Error "Regression in $($bench.FullName): allocated $allocated B (expected 0 B)."
                exit 1
              }
            }
          }
          Write-Host "Zero-allocation invariants verified."
